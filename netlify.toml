[build]
  command = "echo 'JavaScript puro: sem etapa de build do front-end'"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[functions."scheduled-collect"]
  schedule = "*/5 * * * *"

[functions."scheduled-maintenance"]
  schedule = "15 3 * * *"

[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/jobs"
  status = 200

[[redirects]]
  from = "/api/collect-now"
  to = "/.netlify/functions/collect-now"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/maintenance"
  to = "/.netlify/functions/maintenance"
  status = 200

[[redirects]]
  from = "/api/push/public-key"
  to = "/.netlify/functions/push-public-key"
  status = 200

[[redirects]]
  from = "/api/push/subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

[[redirects]]
  from = "/api/push/unsubscribe"
  to = "/.netlify/functions/push-unsubscribe"
  status = 200
